<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel Cost Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="icon">🚗</div>
        <div>
          <h1>Fuel Cost Calculator</h1>
          <p>Calculate fuel usage and travel cost easily</p>
        </div>
      </div>

      <div class="form">
        <label for="distance">Distance (km)</label>
        <input type="number" id="distance" placeholder="e.g. 120" min="0" step="0.1">

        <label for="mileage">Vehicle Mileage (km/L)</label>
        <input type="number" id="mileage" placeholder="e.g. 15" min="0.1" step="0.1">

        <label for="fuelPrice">Fuel Price (BDT/L)</label>
        <input type="number" id="fuelPrice" placeholder="e.g. 120" min="0" step="0.01">

        <button onclick="calculateFuel()">Calculate</button>
        <button class="reset" onclick="resetCalculator()">Reset</button>
      </div>

      <div id="error" class="error"></div>

      <div class="results" id="results">
        <div class="result-box">
          <span>⛽ Fuel Required</span>
          <strong id="fuelRequired">0.00 L</strong>
        </div>

        <div class="result-box">
          <span>💰 Total Travel Cost</span>
          <strong id="totalCost">0.00 BDT</strong>
        </div>

        <div class="result-box">
          <span>📏 Cost per KM</span>
          <strong id="costPerKm">0.00 BDT</strong>
        </div>
      </div>

      <div class="formula">
        <h3>How it works</h3>
        <p><b>Fuel Required</b> = Distance ÷ Mileage</p>
        <p><b>Total Cost</b> = Fuel Required × Fuel Price</p>
      </div>

      <div class="footer">Simple project • HTML • CSS • JavaScript</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
